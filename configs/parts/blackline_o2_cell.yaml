# Blackline oxygen cell: written from configs/gas spec.json + assumptions.json (same numbers as the gas detector engine)
name: Blackline oxygen cell
datasheet: Blackline G7c datasheet R28
measures:
- quantity: air.o2_pct
  params:
    range:
      value:
      - 0
      - 25
      unit: '%vol'
      source: datasheet Blackline G7c datasheet R28 (page not recorded); same value in Blackline G7x datasheet R21, Blackline G8 spec sheet R1
    resolution:
      value: 0.1
      unit: '%vol'
      source: datasheet Blackline G7c datasheet R28 (page not recorded); same value in Blackline G7x datasheet R21, Blackline G8 spec sheet R1
    t90_s:
      value: 15
      unit: s
      source: 'ASSUMPTION: No response times given. Sensor response is modelled as first order with time constant T90 / ln(10).'
    t90_up_s:
      value: 45.0
      unit: s
      source: 'ASSUMPTION: Brief: the value falls more slowly than it rises. Fall time constant = 3 x rise time constant. (= 3 × t90); for O2 the exposure lowers the value, so recovery is the rise'
    noise_sd:
      value: 0.03
      unit: '%vol'
      source: 'ASSUMPTION: No noise specification given. Small Gaussian noise so clean air reads at or next to the baseline at the stated resolution. Not a field noise model.'
