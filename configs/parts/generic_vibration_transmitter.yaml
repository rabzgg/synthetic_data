# A vibration transmitter that reports RMS velocity (ISO 10816 / 20816 style), 0-25 mm/s.
# No particular product: every value is an ASSUMPTION of a typical transmitter of this class.
name: Generic vibration transmitter 25 mm/s
datasheet: "none: a generic RMS velocity transmitter (all values ASSUMPTION)"
measures:
  - quantity: machine.vibration_mm_s
    params:
      range: {value: [0, 25], unit: mm/s, source: "ASSUMPTION: 0-25 mm/s, the usual range for pumps and fans"}
      resolution: {value: 0.01, unit: mm/s, source: "ASSUMPTION: digital output step"}
      noise_sd: {value: 0.02, unit: mm/s, source: "ASSUMPTION"}
      t90_s: {value: 5, unit: s, source: "ASSUMPTION: the RMS is averaged over a few seconds"}
    from_datasheet:
      - {rule: accuracy_pct_reading, value: 5, unit: "%", kind: max, source: "ASSUMPTION: ±5 % of reading, typical for this class"}
