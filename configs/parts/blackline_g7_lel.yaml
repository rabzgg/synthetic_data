# Blackline G7 LEL sensor: written from configs/gas spec.json + assumptions.json (same numbers as the gas detector engine)
name: Blackline G7 LEL sensor
datasheet: Blackline G7c datasheet R28
measures:
- quantity: air.lel_pct
  params:
    range:
      value:
      - 0
      - 100
      unit: '%LEL'
      source: datasheet Blackline G7c datasheet R28 (page not recorded); same value in Blackline G7x datasheet R21
    resolution:
      value: 1
      unit: '%LEL'
      source: datasheet Blackline G7c datasheet R28 (page not recorded); same value in Blackline G7x datasheet R21
    t90_s:
      value: 20
      unit: s
      source: 'ASSUMPTION: No response times given. Sensor response is modelled as first order with time constant T90 / ln(10).'
    t90_down_s:
      value: 60.0
      unit: s
      source: 'ASSUMPTION: Brief: the value falls more slowly than it rises. Fall time constant = 3 x rise time constant. (= 3 × t90)'
    noise_sd:
      value: 0.3
      unit: '%LEL'
      source: 'ASSUMPTION: No noise specification given. Small Gaussian noise so clean air reads at or next to the baseline at the stated resolution. Not a field noise model.'
notes:
- Combustible gas sensor of the G7c and G7x; the datasheets give range and resolution only.
