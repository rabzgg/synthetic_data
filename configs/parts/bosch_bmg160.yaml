      - {rule: noise_density, value: 0.014, unit: "°/s/√Hz", bandwidth_hz: 12, source: "ASSUMPTION: [USER TO VERIFY] 0.014 °/s/√Hz; another snippet says 0.007, the larger is used; bandwidth 12 Hz = lowest of the 12 … 230 Hz settings in the distributor listing"}
