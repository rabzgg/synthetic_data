# MSA ALTAIR LEL sensor: written from configs/gas spec.json + assumptions.json (same numbers as the gas detector engine)
name: MSA ALTAIR LEL sensor
datasheet: MSA spec sheet 1708-056
measures:
- quantity: air.lel_pct
  params:
    range:
      value:
      - 0
      - 100
      unit: '%LEL'
      source: datasheet MSA spec sheet 1708-056 (page not recorded)
    resolution:
      value: 1
      unit: '%LEL'
      source: datasheet MSA spec sheet 1708-056 (page not recorded)
    t90_s:
      value: 20
      unit: s
      source: 'ASSUMPTION: No response times given. Sensor response is modelled as first order with time constant T90 / ln(10).'
    t90_down_s:
      value: 60.0
      unit: s
      source: 'ASSUMPTION: Brief: the value falls more slowly than it rises. Fall time constant = 3 x rise time constant. (= 3 × t90)'
    noise_sd:
      value: 0.3
      unit: '%LEL'
      source: 'ASSUMPTION: No noise specification given. Small Gaussian noise so clean air reads at or next to the baseline at the stated resolution. Not a field noise model.'
