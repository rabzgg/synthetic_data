# MSA ALTAIR io6 PID (VOC) sensor: written from configs/gas spec.json + assumptions.json (same numbers as the gas detector engine)
name: MSA ALTAIR io6 PID (VOC) sensor
datasheet: 'none found: io6 PID table not found'
measures:
- quantity: air.voc_ppm
  params:
    range:
      value:
      - 0
      - 4000
      unit: ppm
      source: 'ASSUMPTION: borrowed from Blackline PID (G7c R28); io6 PID table not found'
    resolution:
      value: 0.1
      unit: ppm
      source: 'ASSUMPTION: borrowed from Blackline PID (G7c R28); io6 PID table not found'
    t90_s:
      value: 15
      unit: s
      source: 'ASSUMPTION: No response times given. Sensor response is modelled as first order with time constant T90 / ln(10).'
    t90_down_s:
      value: 45.0
      unit: s
      source: 'ASSUMPTION: Brief: the value falls more slowly than it rises. Fall time constant = 3 x rise time constant. (= 3 × t90)'
    noise_sd:
      value: 0.1
      unit: ppm
      source: 'ASSUMPTION: No noise specification given. Small Gaussian noise so clean air reads at or next to the baseline at the stated resolution. Not a field noise model.'
notes:
- 'Every datasheet value is borrowed from the Blackline PID (G7c R28): the io6 PID table was not found.'
