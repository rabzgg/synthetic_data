# Preset: MSA ALTAIR io6, rebuilt from parts with the numbers of configs/gas/msa_altair_io6/spec.json
name: MSA ALTAIR io6
slug: msa_altair_io6
device_id_prefix: MSA_ALTAIR_IO6
description: 'MSA ALTAIR io6: 4-gas detector plus PID (VOC) and a sampling pump.'
created: '2026-10-15'
version: 1
preset: true
datasheet: MSA spec sheet 1708-056 (ALTAIR io4 spec sheet)
parts:
- part: msa_altair_lel
  note: 'ASSUMPTION: same sensors as io4 (io6 sensor table not found)'
- part: msa_altair_o2_cell
  note: 'ASSUMPTION: same sensors as io4 (io6 sensor table not found)'
- part: msa_altair_co_cell
  note: 'ASSUMPTION: same sensors as io4 (io6 sensor table not found)'
- part: msa_altair_h2s_cell
  note: 'ASSUMPTION: same sensors as io4 (io6 sensor table not found)'
- part: msa_altair_pid_voc
  note: 'ASSUMPTION: borrowed from Blackline PID (G7c R28); io6 PID table not found'
features:
  sample_interval_s:
    value: 10
    unit: s
    source: 'ASSUMPTION: Datasheets give no logging interval; 10 s as set in the task brief.'
  connectivity:
    value: cellular
    unit: '-'
    source: 'ASSUMPTION: No signal specification given. Bounded random walk, one step per logging interval. Reported by every device.'
logic:
- block: rolling_mean
  input: air.co_ppm
  output: co_stel_ppm
  window_s:
    value: 900
    unit: s
    source: 'ASSUMPTION: Brief: STEL = rolling 15-min mean. How the first 15 min are handled is not specified; zero-fill chosen.'
- block: cumulative_dose
  input: air.co_ppm
  output: co_twa_ppm
  period_s:
    value: 28800
    unit: s
    source: 'ASSUMPTION: Brief: TWA = 8-h average. Computed as the accumulated dose divided by 8 h (the 8-h TWA of the shift so far), not as a mean over the elapsed time.'
- block: rolling_mean
  input: air.h2s_ppm
  output: h2s_stel_ppm
  window_s:
    value: 900
    unit: s
    source: 'ASSUMPTION: Brief: STEL = rolling 15-min mean. How the first 15 min are handled is not specified; zero-fill chosen.'
- block: cumulative_dose
  input: air.h2s_ppm
  output: h2s_twa_ppm
  period_s:
    value: 28800
    unit: s
    source: 'ASSUMPTION: Brief: TWA = 8-h average. Computed as the accumulated dose divided by 8 h (the 8-h TWA of the shift so far), not as a mean over the elapsed time.'
- block: event_mode
  output: device_mode
  event: bump_test
  value: bump_test
  default: normal
  until_back:
  - air.lel_pct
  - air.o2_pct
  - air.co_ppm
  - air.h2s_ppm
- block: state_flag
  output: pump_state
  state: pump
  on_value: fault
  off_value: 'on'
- block: state_flag
  output: pump_alarm
  state: pump
  on_value: 1
  off_value: 0
- block: battery
  output: battery_pct
  runtime_h:
    value: 17
    unit: h
    source: 'ASSUMPTION: same battery as io4 (io6 battery table not found)'
  start_pct:
    value: 100
    unit: '%'
    source: 'ASSUMPTION: Datasheets give runtime only. Battery starts full and drains linearly: pct = floor(100 - 100 * t / runtime). Over an 8-h shift that is 47 % (17 h) or 44 % (18 h).'
- block: signal
  output: signal_strength_dbm
  range_dbm:
    value:
    - -115
    - -55
    unit: dBm
    source: 'ASSUMPTION: No signal specification given. Bounded random walk, one step per logging interval. Reported by every device.'
  start_dbm:
    value:
    - -90
    - -70
    unit: dBm
    source: 'ASSUMPTION: No signal specification given. Bounded random walk, one step per logging interval. Reported by every device.'
  step_sd_db:
    value: 1.0
    unit: dB
    source: 'ASSUMPTION: No signal specification given. Bounded random walk, one step per logging interval. Reported by every device.'
- block: threshold_alarm
  input: air.lel_pct
  output: lel_alarm_low
  level:
    value: 10
    unit: '%LEL'
    source: 'ASSUMPTION: Not in the provided datasheets. Placeholder of a typical order of magnitude; replace with the setpoint configured on the real device.'
  when: above
- block: threshold_alarm
  input: air.lel_pct
  output: lel_alarm_high
  level:
    value: 20
    unit: '%LEL'
    source: 'ASSUMPTION: Not in the provided datasheets. Placeholder of a typical order of magnitude; replace with the setpoint configured on the real device.'
  when: above
- block: threshold_alarm
  input: air.lel_pct
  output: lel_over_range
  level: range_max
  when: above
- block: threshold_alarm
  input: air.o2_pct
  output: o2_alarm_low
  level:
