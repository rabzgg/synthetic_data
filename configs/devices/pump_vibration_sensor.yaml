# A vibration sensor on a pump housing, logging RMS vibration velocity every 10 s, with an alarm.
name: Pump Vibration Sensor
device_id_prefix: PUMPVIB
description: "RMS vibration velocity of a pump, from a transmitter on the bearing housing, logged every 10 s, with a vibration alarm."
created: "2026-10-22"
version: 1
preset: true
parts:
  - part: generic_vibration_transmitter
features:
  sample_interval_s: {value: 10, unit: s, source: "ASSUMPTION: condition monitoring every 10 s"}
logic:
  - block: threshold_alarm
    input: machine.vibration_mm_s
    output: vibration_alarm
    level: {value: 4.5, unit: mm/s, source: "ASSUMPTION: about the ISO 10816 zone boundary for a pump of this size [USER TO VERIFY]"}
    when: above
    hysteresis: {value: 0.3, unit: mm/s, source: "ASSUMPTION"}
