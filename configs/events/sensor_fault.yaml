kind: sensor_fault
name: Sensor fault
description: "One sensor of the device fails for a while. It sticks at its last value, reads zero, or reads off by a fixed amount."
params:
  quantity: {value: air.h2s_ppm, unit: "-", source: "ASSUMPTION: default quantity"}
  mode: {value: stuck, unit: "-", source: "ASSUMPTION: default mode", choices: [stuck, zero, offset]}
  offset: {value: 0, unit: "quantity unit", source: "ASSUMPTION: used with mode offset"}
  duration_s: {value: 600, unit: s, source: "ASSUMPTION: ten minutes"}
label: "{quantity} {mode}"
effects:
  - {target: device.input, quantity: $quantity, op: $mode, value: $offset}
