# World preset: inside a household fridge, driven by its compressor cycle.
name: fridge
title: "Inside a fridge"
realism: ASSUMPTION
description: "The air inside a household fridge: the compressor runs about 40 % of the time in cycles of about half an hour; the temperature swings around 5 °C with it and the compressor current follows the same cycle. Dark inside. No real recording behind it."
grid:
  air_dt_s: {value: 1, unit: s, source: "ASSUMPTION: air changes over seconds; the fastest gas sensor t90 is 15 s"}
  body_dt_s: {value: 0.04, unit: s, source: "ASSUMPTION: 25 Hz resolves steps (about 2 Hz) and a fall impact (about 0.1 s)"}
time:
  start_utc: {value: "2026-01-05T06:00:00Z", unit: "ISO 8601", source: "ASSUMPTION: same shift start as configs/gas/assumptions.json"}
  utc_offset_h: {value: 0, unit: h, source: "ASSUMPTION: local time = UTC"}
earth_field_ut: {value: [19.5, 0.0, -44.5], unit: µT, source: "ASSUMPTION: mid-latitude field in world axes (x north, z up), about 49 µT, inclination about 66°"}
signals:
  compressor:
    duty_cycle: {period_s: {value: 1800, unit: s, source: "ASSUMPTION: a household fridge cycles about twice per hour"}, duty: {value: 0.4, unit: "-", source: "ASSUMPTION: compressor runs about 40 % of the time"}, on_value: {value: 1, unit: "-", source: "ASSUMPTION: on"}, off_value: {value: 0, unit: "-", source: "ASSUMPTION: off"}, transition_s: {value: 5, unit: s, source: "ASSUMPTION: start-up of the motor"}, jitter: {value: 0.15, unit: "-", source: "ASSUMPTION: cycles vary with load and door use"}}
drivers:
  air.temperature_c:
    sum:
      - constant: {value: 21, unit: "°C", source: "ASSUMPTION: kitchen temperature, where the inside would settle without cooling"}
      - product:
          - constant: {value: -40, unit: "°C", source: "ASSUMPTION: cooling at full duty; with 40 % duty the inside settles near 5 °C"}
          - lowpass: {of: {ref: compressor}, tau_s: {value: 6000, unit: s, source: "ASSUMPTION: thermal mass of the cabinet and its contents"}, start: {value: 0.4, unit: "-", source: "ASSUMPTION: the fridge has been running, settled at its duty"}}
  air.vapour_pressure_hpa:
    vapour_from_rh: {rh_pct: {value: 70, unit: "%RH", source: "ASSUMPTION: humid air inside a fridge"}, temperature_c: {value: 5, unit: "°C", source: "ASSUMPTION: the mean inside temperature"}}
  electrical.current_a:
    sum:
      - constant: {value: 0.08, unit: A, source: "ASSUMPTION: electronics and fan while the compressor is off"}
      - product:
          - constant: {value: 0.9, unit: A, source: "ASSUMPTION: compressor current of a household fridge at 230 V"}
          - {ref: compressor}
      - random_walk: {mean: {value: 0, unit: A, source: "ASSUMPTION: around the level"}, sd: {value: 0.01, unit: A, source: "ASSUMPTION: mains and load variation"}, tau_s: {value: 30, unit: s, source: "ASSUMPTION"}}
  light.lux: {constant: {value: 0, unit: lx, source: "ASSUMPTION: dark with the door closed"}}
  air.sea_level_pressure_hpa:
    random_walk: {mean: {value: 1013.25, unit: hPa, source: "ASSUMPTION: standard atmosphere"}, sd: {value: 8, unit: hPa, source: "ASSUMPTION: weather systems"}, tau_s: {value: 172800, unit: s, source: "ASSUMPTION: weather changes over days"}, smooth_s: {value: 43200, unit: s, source: "ASSUMPTION: weather pressure changes smoothly, a few hPa over half a day"}}
  floor_altitude_m: {constant: {value: 0, unit: m, source: "ASSUMPTION: ground floor"}}
motion:
  model: still
  device_height_m: {value: 1.0, unit: m, source: "ASSUMPTION: on a fridge shelf"}
  lying_height_m: {value: 0.15, unit: m, source: "ASSUMPTION: not used without a fall"}
  heading_deg: {value: 0, unit: "°", source: "ASSUMPTION: device faces magnetic north"}
  impact_s: {value: 0.08, unit: s, source: "ASSUMPTION: duration of the impact of a fall"}
  step_hz: {value: 1.8, unit: Hz, source: "ASSUMPTION: not used without walking"}
  speed_m_s: {value: 0, unit: m/s, source: "ASSUMPTION: not used without walking"}
  surge_m_s: {value: 0, unit: m/s, source: "ASSUMPTION: not used without walking"}
  bob_m: {value: 0, unit: m, source: "ASSUMPTION: not used without walking"}
  sway_deg: {value: 0, unit: "°", source: "ASSUMPTION: not used without walking"}
  turn_rate_sd_dps: {value: 0, unit: "°/s", source: "ASSUMPTION: not used without walking"}
  turn_tau_s: {value: 3, unit: s, source: "ASSUMPTION: not used without walking"}
  fidget_deg: {value: 0, unit: "°", source: "ASSUMPTION: the device is not on a person"}
  fidget_tau_s: {value: 2, unit: s, source: "ASSUMPTION: not used"}
  stir_deg: {value: 0, unit: "°", source: "ASSUMPTION: the device is not on a person"}
