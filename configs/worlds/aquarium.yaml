# World preset: a heated freshwater aquarium with a lamp and a pump.
name: aquarium
title: "Aquarium"
realism: ASSUMPTION
description: "A heated freshwater aquarium: stable water temperature, pH that rises while the lamp is on (plants take up CO2), a filter pump that runs 45 min of every hour. No real recording behind it."
grid:
  air_dt_s: {value: 1, unit: s, source: "ASSUMPTION: air changes over seconds; the fastest gas sensor t90 is 15 s"}
  body_dt_s: {value: 0.04, unit: s, source: "ASSUMPTION: 25 Hz resolves steps (about 2 Hz) and a fall impact (about 0.1 s)"}
time:
  start_utc: {value: "2026-01-05T06:00:00Z", unit: "ISO 8601", source: "ASSUMPTION: same shift start as configs/gas/assumptions.json"}
  utc_offset_h: {value: 0, unit: h, source: "ASSUMPTION: local time = UTC"}
earth_field_ut: {value: [19.5, 0.0, -44.5], unit: µT, source: "ASSUMPTION: mid-latitude field in world axes (x north, z up), about 49 µT, inclination about 66°"}
signals:
  lamp:
    schedule: {segments: {value: [[8, 20, 1]], unit: "h, h, -", source: "ASSUMPTION: lamp on 12 h a day"}, default: {value: 0, unit: "-", source: "ASSUMPTION: off at night"}}
  pump:
    duty_cycle: {period_s: {value: 3600, unit: s, source: "ASSUMPTION: filter pump on a timer, every hour"}, duty: {value: 0.75, unit: "-", source: "ASSUMPTION: 45 min on"}, on_value: {value: 1, unit: "-", source: "ASSUMPTION"}, off_value: {value: 0, unit: "-", source: "ASSUMPTION"}, transition_s: {value: 2, unit: s, source: "ASSUMPTION: motor start"}}
drivers:
  water.temperature_c:
    random_walk: {mean: {value: 25, unit: "°C", source: "ASSUMPTION: heater set to 25 °C"}, sd: {value: 0.1, unit: "°C", source: "ASSUMPTION: heater thermostat band"}, tau_s: {value: 1800, unit: s, source: "ASSUMPTION"}, smooth_s: {value: 600, unit: s, source: "ASSUMPTION: water changes temperature slowly"}}
  water.ph:
    sum:
      - constant: {value: 7.0, unit: pH, source: "ASSUMPTION: neutral freshwater tank at night"}
      - product:
          - constant: {value: 0.3, unit: pH, source: "ASSUMPTION: pH rise while plants photosynthesise"}
          - lowpass: {of: {ref: lamp}, tau_s: {value: 7200, unit: s, source: "ASSUMPTION: CO2 uptake builds up over hours"}, start: {value: 0, unit: "-", source: "ASSUMPTION: the world starts in the night, lamp off for hours"}}
  electrical.current_a:
    sum:
      - constant: {value: 0.02, unit: A, source: "ASSUMPTION: standby"}
      - product: [{constant: {value: 0.15, unit: A, source: "ASSUMPTION: small filter pump at 230 V"}}, {ref: pump}]
      - product: [{constant: {value: 0.25, unit: A, source: "ASSUMPTION: LED lamp at 230 V"}}, {ref: lamp}]
  machine.vibration_mm_s:
    sum:
      - constant: {value: 0.02, unit: mm/s, source: "ASSUMPTION: background"}
      - product: [{constant: {value: 0.4, unit: mm/s, source: "ASSUMPTION: a small pump on the tank"}}, {ref: pump}]
  light.lux:
    product: [{constant: {value: 2500, unit: lx, source: "ASSUMPTION: aquarium lamp at the water surface"}}, {ref: lamp}]
  air.temperature_c:
    random_walk: {mean: {value: 21, unit: "°C", source: "ASSUMPTION: living room"}, sd: {value: 0.5, unit: "°C", source: "ASSUMPTION: heating cycles"}, tau_s: {value: 3600, unit: s, source: "ASSUMPTION"}, smooth_s: {value: 300, unit: s, source: "ASSUMPTION: room air changes smoothly"}}
motion:
  model: still
  device_height_m: {value: 1.0, unit: m, source: "ASSUMPTION: on the tank"}
  lying_height_m: {value: 0.15, unit: m, source: "ASSUMPTION: not used without a fall"}
  heading_deg: {value: 0, unit: "°", source: "ASSUMPTION: device faces magnetic north"}
  impact_s: {value: 0.08, unit: s, source: "ASSUMPTION: duration of the impact of a fall"}
  step_hz: {value: 1.8, unit: Hz, source: "ASSUMPTION: not used without walking"}
  speed_m_s: {value: 0, unit: m/s, source: "ASSUMPTION: not used without walking"}
  surge_m_s: {value: 0, unit: m/s, source: "ASSUMPTION: not used without walking"}
  bob_m: {value: 0, unit: m, source: "ASSUMPTION: not used without walking"}
  sway_deg: {value: 0, unit: "°", source: "ASSUMPTION: not used without walking"}
  turn_rate_sd_dps: {value: 0, unit: "°/s", source: "ASSUMPTION: not used without walking"}
  turn_tau_s: {value: 3, unit: s, source: "ASSUMPTION: not used without walking"}
  fidget_deg: {value: 0, unit: "°", source: "ASSUMPTION: the device is not on a person"}
  fidget_tau_s: {value: 2, unit: s, source: "ASSUMPTION: not used"}
  stir_deg: {value: 0, unit: "°", source: "ASSUMPTION: the device is not on a person"}
