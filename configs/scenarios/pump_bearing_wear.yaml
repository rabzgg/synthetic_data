# Scenario: a pump on a day-shift schedule whose bearing wears over three days.
name: pump_bearing_wear
title: "Pump bearing wear"
description: "The pump runs 06:00-22:00 every day; from the first hour its bearing wears and the running vibration grows 2.5-fold over three days."
realism: ASSUMPTION
world: pump_room
duration: 96h
seed: 42
devices:
  - {device: pump_vibration_sensor, mount: fixed, height_m: 0.5}
events:
  - bearing_wear: {at: "01:00:00", duration_h: 72, factor: 2.5}
