# Scenario: Test: STEL alarm (H2S). Rewritten from the gas detector engine (configs/gas/assumptions.json).
name: gas_stel_alarm
title: "Test: STEL alarm (H2S)"
description: "A sustained H2S exposure whose 15-min average passes the STEL limit, plus 0-2 short exposures."
realism: ASSUMPTION
world: indoor_worker_walking
duration: 8h
seed: 42
devices:
  - {device: blackline_g7c, mount: body}
events:
  - bump_test: {at: "00:02:00", applied_s: 60}
  - gas_release:
      at: {random: ["00:17:00", "07:00:00"], source: "ASSUMPTION: placed by the scenario"}
      spacing_s: 1800
      gas: h2s
      level: {random: [20, 30], source: "ASSUMPTION: Random exposures are always 'short'. The other types are placed only by the coverage plan: a sustained H2S exposure that crosses the 15-ppm STEL, a long CO exposure whose 8-h TWA crosses 25 ppm, and an LEL peak above the 100 %LEL range."}
      duration_s: {random: [900, 1500], source: "ASSUMPTION: Random exposures are always 'short'. The other types are placed only by the coverage plan: a sustained H2S exposure that crosses the 15-ppm STEL, a long CO exposure whose 8-h TWA crosses 25 ppm, and an LEL peak above the 100 %LEL range."}
      ramp_s: {value: 0, unit: s, source: "ASSUMPTION: as the gas detector engine: the gas steps, the sensor's t90 shapes the reading"}
  - gas_release:
      count: {random_int: [0, 2], source: "ASSUMPTION: Brief: 1-3 exposures per shift. Drawn uniformly."}
      at: {random: ["00:17:00", "07:15:00"], source: "ASSUMPTION: after the bump test and 15 min, ending 45 min before the shift ends (gas engine placement)"}
      spacing_s: 1800
      gas: {choice_measured: [lel, co, h2s, voc], source: "ASSUMPTION: Combustible and toxic gases (VOC on io6 only); O2 deficiency events are not modelled."}
      level:
        by_gas: {lel: {random: [5, 25]}, co: {random: [20, 150]}, h2s: {random: [3, 20]}, voc: {random: [20, 200]}}
        source: "ASSUMPTION: Peak levels drawn uniformly; ranges chosen so that some exposures cross the alarm setpoints."
      duration_s: {random: [120, 600], source: "ASSUMPTION: Duration at the peak level, drawn uniformly."}
      ramp_s: {value: 0, unit: s, source: "ASSUMPTION: as the gas detector engine: the gas steps, the sensor's t90 shapes the reading"}
  - connection_loss:
      count: {random_int: [1, 3]}
      at: {random: ["00:10:00", "07:55:00"], source: "ASSUMPTION: not in the first 10 min (configs/gas/assumptions.json connection_gaps)"}
      spacing_s: 1
      duration_s: {random: [30, 300], source: "ASSUMPTION: Periods without rows, as from a lost connection. Each gap is announced on the next row so that the gate can tell an intended gap from a row lost to a bug. No gap during the bump test."}
      optional: true
  - sos:
      at: {random: ["00:00:00", "07:55:00"]}
      duration_s: {random: [60, 300], source: "ASSUMPTION: Brief: one SOS on the G8 in every shift. Independent of the gas readings."}
      optional: true
