# Every push and pull request: all tests, then every scenario on five seeds through the gate.
# A green check on the commit means both passed. See "Editing in the browser" in README.md.
name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: All scenarios through the gate
        run: python validation/run_all_scenarios.py
